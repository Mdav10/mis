{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change Password</h1>

<section class="card narrow">
  <form method="POST">
    {{ form.hidden_tag() }}
    <label>Current password</label>{{ form.current() }}
    <label>New password (min 10)</label>{{ form.new() }}
    <label>Confirm new password</label>{{ form.confirm() }}
    <button class="primary big" style="width:100%">Update</button>
  </form>
</section>
{% endblock %}
