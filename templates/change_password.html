{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1><span class="accent">◆</span> Change Password</h1>

<section class="card narrow">
  <form method="POST">
    {{ form.hidden_tag() }}
    <label>Current Password</label>{{ form.current() }}
    <label>New Password (min 10 chars)</label>{{ form.new() }}
    <label>Confirm New Password</label>{{ form.confirm() }}
    <button class="primary" style="width:100%">Update Password</button>
  </form>
</section>
{% endblock %}
