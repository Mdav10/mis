{% extends "base.html" %}
{% block title %}Confirm{% endblock %}
{% block content %}
<h1>Confirm Password</h1>
<section class="card narrow">
  <p class="dim">For security, re-enter your password to continue.</p>
  <form method="POST">
    {{ form.hidden_tag() }}
    <label>Password</label>{{ form.password() }}
    <button class="primary big" style="width:100%">Confirm</button>
  </form>
</section>
{% endblock %}
